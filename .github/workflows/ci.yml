name: CI quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything in CI runs on the deterministic fake LLM: no secrets needed.
  LLM_PROVIDER: fake
  PYTHONUNBUFFERED: "1"
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
  PROMPTFOO_DISABLE_TELEMETRY: "1"
  PROMPTFOO_DISABLE_UPDATE: "1"

jobs:
  tests:
    name: Traditional tests (unit, API, UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit, API and example tests
        run: pytest --junitxml=reports/junit-unit.xml
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Playwright UI tests
        run: pytest -m ui --junitxml=reports/junit-ui.xml --tracing retain-on-failure --output reports/playwright
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  change-hygiene:
    name: Labels and grader change in separate commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check every new commit
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE..$SHA"
          else
            RANGE="$SHA~1..$SHA"
          fi
          echo "Checking $RANGE"
          python -m evals.change_hygiene --range "$RANGE"

  ai-evals:
    name: AI evals (golden set, judge check, DeepEval)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-evals.txt
      - name: Golden dataset eval + quality gates
        run: python -m evals.run_evals
      - name: Publish eval report to the job summary
        if: always()
        run: cat evals/results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Validate the evaluator (judge vs human labels)
        run: python -m evals.judge.judge_agreement --min-kappa 0.5
      - name: Grader severity report (informational, simulated reviewers)
        run: |
          python -m evals.severity.run_severity > /dev/null
          cat evals/results/severity_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Graded severity report (informational, simulated reviewers)
        run: |
          python -m evals.severity.run_graded > /dev/null
          cat evals/results/graded_severity_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: DeepEval suite
        run: pytest evals/deepeval -v
      - name: Gate sanity check (a hallucinating model MUST fail the gate)
        env:
          FAKE_LLM_BEHAVIOR: hallucinate
        run: |
          if python -m evals.run_evals --out /tmp/negative-control > /dev/null; then
            echo "::error::The quality gate passed a hallucinating model. The gate is broken."
            exit 1
          fi
          echo "Gate correctly rejected the hallucinating model."
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/

  promptfoo:
    name: Promptfoo regression suite
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run Promptfoo eval
        env:
          PROMPTFOO_PYTHON: python
        run: npx -y promptfoo@0.124.0 eval -c evals/promptfoo/promptfooconfig.yaml --no-cache --no-progress-bar -o promptfoo-results.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: promptfoo-results.json
          if-no-files-found: ignore
